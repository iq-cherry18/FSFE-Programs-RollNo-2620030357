<!DOCTYPE html>
<html>
<head>
    <title>EmployeeRegistrationForm</title>
</head>
<body align="left">
    <h2>Employee Registration Form</h2>

    Employee Name: <input type="text" name="g1" placeholder="enter your name" autofocus required><br><br>

    Password: <input type="password" name="g2" min="6" required><br><br>

    Email: <input type="email" name="g3" required><br><br>

    Mobile Number: <input type="number" name="g4" pattern="[0-9]{10}" required><br><br>

    Age: <input type="text" name="g5" required><br><br>

    Date Of Birth: <input type="date" name="g6"><br><br>

    Preferred Intervier Time: <input type="time" name="g7"><br><br>

    Gender: <input type="radio" name="g8" required>male
            <input type="radio" name="g8">female<br><br>

    Skills: <input type="checkbox" name="g9">HTML
           <input type="checkbox" name="g9">CSS
           <input type="checkbox" name="g9">HTML<br><br>

    Skill Development: <select>
                        <option>select option</option>
                        <option>it</option>
                        <option>hr</option>
                        <option>finance</option>
                       </select><br><br>

    Upload Resume: <input type="file" name="g10" required><br><br>

    Address: <textarea rows="4" placeholder="enter your address"></textarea><br><br>

    Work Experience: <input type="range" min="0" max="20" name="g11"><br><br>

    Linkedin Profile: <input type="url" name="g12" placeholder="enter linkedin URL"><br><br>

    <button type="submit">submit</button>
    <button type="reset">reset</button>
</body>
</html>
